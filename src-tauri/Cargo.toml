[package]
name = "wallpaper_studio"
version = "0.1.0"
description = "Native 4K Wallpaper Generator Windows Desktop App"
authors = ["WallpaperStudio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
